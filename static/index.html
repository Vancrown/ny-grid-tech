<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borrow Watts — NYC Energy</title>
<style>
  :root { --navy:#0a1223; --teal:#10c9a0; --gray:#9ca3af; --coral:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--navy); color:#e2e8f0;
    font:14px/1.7 'Inter','Roboto',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #boot { width:min(560px, 88vw); text-align:center; }
  #boot h1 { font-size:1.5rem; margin:0 0 .35rem; letter-spacing:-.02em; }
  #boot h1 span { color:var(--teal); }
  #boot p.sub { color:var(--gray); font-size:.82rem; margin:0 0 2rem; letter-spacing:.16em; text-transform:uppercase; }
  #bar { height:4px; background:#1e3a5f; border-radius:99px; overflow:hidden; }
  #bar > i { display:block; height:100%; width:0%; background:var(--teal); border-radius:99px; transition:width .35s ease; }
  #boot-status { margin-top:1rem; font-size:.8rem; color:var(--gray); min-height:1.4em; }
  #boot-status.err { color:var(--coral); }
  #boot-hint { margin-top:2rem; font-size:.72rem; color:#4b5563; }
  #boot-detail { margin-top:.6rem; font-size:.72rem; color:#4b5563; }
  details { margin-top:2rem; text-align:left; }
  summary { cursor:pointer; color:var(--gray); font-size:.75rem; }
  pre { white-space:pre-wrap; font-size:.72rem; color:var(--gray); background:#0d1728; padding:1rem; border-radius:8px; border:1px solid #1e3a5f; max-height:40vh; overflow:auto; }
</style>
</head>
<body>
<div id="boot">
  <h1>Borrow Watts from <span>Neighbours</span></h1>
  <p class="sub">NYC's energy sharing network</p>
  <div id="bar"><i></i></div>
  <div id="boot-status">Starting Python runtime…</div>
  <div id="boot-detail"></div>
  <div id="boot-hint">First visit downloads the Python runtime (~25 MB) and is cached afterwards.</div>
  <details id="boot-log"><summary>Diagnostics</summary><pre id="boot-log-pre"></pre></details>
</div>
<script type="module" src="./boot.js"></script>
</body>
</html>
